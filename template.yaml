experiment_name: mnist_baseline

seed: 42

data:
  batch_size: 64
  num_workers: 4

model:
  input_dim: 784
  hidden_dim: 128
  num_classes: 10
  lr: 0.001

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1

early_stopping:
  monitor: val_loss
  patience: 5
  mode: min
  min_delta: 0.0

checkpoint:
  filename: best
  monitor: val_loss
  mode: min
  save_top_k: 1
  save_last: true
